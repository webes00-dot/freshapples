name: Scanner V2 release audit

on:
  push:
    branches: [scanner-v2-recovery]
    paths:
      - '.github/workflows/scanner-v2-release-audit.yml'
      - 'scripts/scanner_v2_release_audit.py'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify normalization rules
        run: python3 -m unittest discover -s collector/tests
      - name: Install capture dependencies
        run: |
          python3 -m pip install playwright
          python3 -m playwright install --with-deps chromium
      - name: Build the published public retailer directory
        run: python3 scripts/build_public_snapshot.py
      - name: Capture public menus
        run: python3 scripts/scanner_v2_release_audit.py --public-directory dist/data/retailer_locations.json --output "$RUNNER_TEMP/v2-release-audit"
      - name: Save public menu evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: scanner-v2-release-audit
          path: ${{ runner.temp }}/v2-release-audit/
          retention-days: 14
          if-no-files-found: ignore
