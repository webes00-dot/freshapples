name: MNtrees menu scans
on:
  workflow_dispatch:
    inputs:
      scan_run_id:
        description: Existing scan run ID to republish without rescanning (optional)
        type: string
  push:
    branches: [main]
    paths:
      - '.github/workflows/scan.yml'
      - 'collector/**'
      - 'data/retailer_menu_scan_targets.json'
      - 'migrations/catalog_scanner.sql'
  schedule:
    - cron: '0 8,20 * * *'
      timezone: 'America/Chicago'
permissions:
  contents: read
  actions: read
  id-token: write
concurrency:
  group: mntrees-staging-scan
  cancel-in-progress: false
jobs:
  scan:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Select fresh scan or archived results
        id: source
        env:
          INPUT_RUN: ${{ inputs.scan_run_id }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          run_id="$INPUT_RUN"
          if [ -z "$run_id" ]; then
            run_id=$(printf '%s\n' "$COMMIT_MESSAGE" | sed -n 's/^MNtrees-Scan-Artifact: \([0-9]*\)$/\1/p' | tail -1)
          fi
          if [ -n "$run_id" ] && [[ ! "$run_id" =~ ^[0-9]+$ ]]; then
            echo "Scan run ID must be a number."
            exit 1
          fi
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
      - name: Reuse archived scan results
        if: steps.source.outputs.run_id != ''
        uses: actions/download-artifact@v4
        with:
          name: mntrees-scan-${{ steps.source.outputs.run_id }}
          run-id: ${{ steps.source.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: collector/data
      - name: Discover retail locations and load scan targets from D1
        if: steps.source.outputs.run_id == ''
        continue-on-error: true
        run: |
          python3 collector/discover_entities.py retailers \
            --targets "$RUNNER_TEMP/menu-targets.json" \
            --output "$RUNNER_TEMP/retailer-discoveries.json"
      - name: Scan configured retailer menus
        if: steps.source.outputs.run_id == ''
        run: python3 collector/collector.py --workers 8 --targets "$RUNNER_TEMP/menu-targets.json"
      - name: Save advertised prices and listings to D1
        run: python3 collector/publish_offers.py
      - name: Reconcile discovered brands and strains with D1
        if: steps.source.outputs.run_id == ''
        run: |
          python3 collector/discover_entities.py products \
            --output "$RUNNER_TEMP/product-discoveries.json"
      - name: Save entity discovery report
        if: always() && steps.source.outputs.run_id == ''
        uses: actions/upload-artifact@v4
        with:
          name: mntrees-entity-discovery-${{ github.run_id }}
          path: ${{ runner.temp }}/*-discoveries.json
          if-no-files-found: ignore
          retention-days: 30
      - name: Archive scan results
        if: always() && steps.source.outputs.run_id == ''
        uses: actions/upload-artifact@v4
        with:
          name: mntrees-scan-${{ github.run_id }}
          path: |
            collector/data/latest_scan.json
            collector/data/candidate_products.json
          retention-days: 30
