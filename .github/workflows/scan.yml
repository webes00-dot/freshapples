name: MNtrees menu scans
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/scan.yml'
      - 'collector/**'
      - 'data/retailer_menu_scan_targets.json'
      - 'migrations/catalog_scanner.sql'
  schedule:
    - cron: '0 8,20 * * *'
      timezone: 'America/Chicago'
permissions:
  contents: read
concurrency:
  group: mntrees-staging-scan
  cancel-in-progress: false
jobs:
  scan:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Scan configured retailer menus
        run: python3 collector/collector.py --workers 8
      - name: Save advertised prices and listings to D1
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python3 collector/publish_offers.py
      - name: Archive scan results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mntrees-scan-${{ github.run_id }}
          path: |
            collector/data/latest_scan.json
            collector/data/candidate_products.json
          retention-days: 30
